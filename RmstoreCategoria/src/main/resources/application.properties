spring.application.name=rmstore-backend

# Puerto de la aplicación
server.port=8080

# Configuración de conexión MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/rmstore_catalogo_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate (actualiza tablas y ejecuta import.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Permite cargar el script SQL
spring.sql.init.mode=always

