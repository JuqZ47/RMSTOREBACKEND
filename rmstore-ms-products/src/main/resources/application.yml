server:
  address: ${SERVER_HOST:127.0.0.1}
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: rmstore-ms-products
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:${DB_PORT:3317}/rmstore?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USER:rmstore_app}
    password: ${DB_PASSWORD:rmstore_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5174,http://127.0.0.1:5174}
